name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      ALPACA_API_KEY: ""
      ALPACA_API_SECRET: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare isolated configuration root
        run: |
          data_dir="$RUNNER_TEMP/finance-research-agent-data"
          dotenv_path="$RUNNER_TEMP/finance-research-agent-config/.env"
          printf 'AI_MARKET_RESEARCH_DATA_DIR=%s\n' "$data_dir" >> "$GITHUB_ENV"
          printf 'AI_MARKET_RESEARCH_DOTENV_PATH=%s\n' "$dotenv_path" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$dotenv_path")"
          : > "$dotenv_path"
          chmod 600 "$dotenv_path"
          mkdir -p "$data_dir/config"
          chmod 700 "$data_dir" "$data_dir/config"
          cp config/examples/*.yaml "$data_dir/config/"
          chmod 600 "$data_dir/config/"*.yaml

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          uv export --locked --all-extras --no-emit-project --no-annotate --no-header \
            --format requirements.txt --output-file "$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"

      - name: Check local doctor
        run: bash scripts/doctor.sh

      - name: Check generated schemas
        run: python -m finance_research_agent.schema_export --check

      - name: Check docs and examples
        run: python -m scripts.check_docs_examples

      - name: Check tracked secrets
        run: python -m scripts.check_secrets

      - name: Check plugin wheel and sdist
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q tests/contracts/test_plugin_package.py
          tests/contracts/test_skill_package_build.py -k
          "wheel_contains or sdist_contains or build_rejects or manifest or bundled_mcp or personal_marketplace"

      - name: Check fresh wheel installation
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q tests/contracts/test_skill_package_build.py
          -k temporary_wheel_install

      - name: Check formatting
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          changed_python_files = subprocess.check_output(
              [
                  "git", "diff", "--name-only", "--diff-filter=ACMRT", "-z",
                  "HEAD^", "HEAD", "--", "*.py",
              ]
          ).split(b"\0")
          file_names = [os.fsdecode(path) for path in changed_python_files if path]
          if file_names:
              raise SystemExit(subprocess.call(["ruff", "format", "--check", *file_names]))
          PY

      - name: Check Ruff
        run: ruff check .

      - name: Check mypy
        run: mypy src

      - name: Check unit and integration tests
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q --ignore=tests/evaluation
          --ignore=tests/integration/test_failure_injection.py

      - name: Check scenarios and failure matrix
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q tests/evaluation
          tests/integration/test_failure_injection.py

      - name: Check whole-package coverage
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" --cov=finance_research_agent
          --cov-report=term-missing --cov-fail-under=90

      - name: Check offline network boundary
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q
          tests/security/test_offline_network_guard.py
          tests/security/test_release_boundary.py

      - name: Check compatibility consumers
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" -q
          tests/unit/test_product_a_vertical_slice_characterization.py
          tests/application/test_historical_market_bridge.py
          tests/application/test_regime_workflow.py
          tests/application/test_regime_research.py
          tests/adapters/test_alpaca_historical_client.py
          tests/evals/test_regime.py tests/evals/test_regime_replay.py

      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
