name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      AI_MARKET_RESEARCH_DATA_DIR: ${{ runner.temp }}/finance-research-agent-data
      AI_MARKET_RESEARCH_DOTENV_PATH: ${{ runner.temp }}/finance-research-agent-config/.env
      ALPACA_API_KEY: ""
      ALPACA_API_SECRET: ""
      OPENAI_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prepare isolated configuration root
        run: |
          mkdir -p "$(dirname "$AI_MARKET_RESEARCH_DOTENV_PATH")"
          : > "$AI_MARKET_RESEARCH_DOTENV_PATH"
          chmod 600 "$AI_MARKET_RESEARCH_DOTENV_PATH"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation .
          uv export --locked --all-extras --no-emit-project --no-annotate --no-header \
            --format requirements.txt --output-file "$RUNNER_TEMP/requirements.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"

      - name: Check generated schemas and canonical documentation
        run: |
          python -m finance_research_agent.schema_export --check
          python -m scripts.check_docs_examples

      - name: Check tracked secrets
        run: python -m scripts.check_secrets

      - name: Check plugin package contract
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m pytest tests/contracts/test_plugin_package.py -v

      - name: Check formatting
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          changed_python_files = subprocess.check_output(
              [
                  "git", "diff", "--name-only", "--diff-filter=ACMRT", "-z",
                  "HEAD^", "HEAD", "--", "*.py",
              ]
          ).split(b"\0")
          file_names = [os.fsdecode(path) for path in changed_python_files if path]
          if file_names:
              raise SystemExit(subprocess.call(["ruff", "format", "--check", *file_names]))
          PY

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src

      - name: Check scenarios, security, replay, and offline coverage
        env:
          FINANCE_RESEARCH_AGENT_OFFLINE_TESTS: "1"
          PYTHONPATH: ${{ github.workspace }}/tests/network_guard:${{ github.workspace }}/src:${{ github.workspace }}
        run: >-
          python -m pytest -m "not live" --cov=finance_research_agent
          --cov-report=term-missing --cov-fail-under=90

      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
